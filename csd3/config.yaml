# see https://snakemake.github.io/snakemake-plugin-catalog/plugins/executor/slurm.html

# CSD3 default resources (comment/uncomment as preferred)
default-resources:
    slurm_account: a-downie-sl3-cpu
    slurm_partition: icelake
    mem_mb_per_cpu: 3370
    # slurm_partition: sapphire
    # mem_mb_per_cpu: 4580

# container settings
use-singularity: True
use-conda: True

# SLURM execution
executor: slurm
cores: 256                              # global maximum CPUs
jobs: 100                               # maximum number of concurrent jobs
max-jobs-per-timespan: "10/1s"          # submit max 10 jobs per second
seconds-between-status-checks: 300      # check the queue every 5 minutes
retries: 1                              # retry failed jobs once
keep-going: True                        # if a job fails, continue the pipeline for other jobs
rerun-incomplete: True                  # incomplete jobs run again
printshellcmds: True                    # print shell commands that are run
latency-wait: 30                        # wait 30s for files to be written to disk
local-cores: 2                          # at most 2 CPUs for local jobs

# resources for each rule
set-resources:
    samtools_index:
        runtime: 360
        cpus_per_task: 16
    create_dict:
        runtime: 120
        cpus_per_task: 16
        mem_mb: 32000 # we set this for Picard -Xmx memory setting
    gffread:
        runtime: 360
        cpus_per_task: 16
    bwa_mem_index:
        runtime: 360
        cpus_per_task: 16
    bowtie2_build:
        runtime: 360
        cpus_per_task: 16
    star_index:
        runtime: 360
        cpus_per_task: 48
    salmon_decoy:
        runtime: 360
        cpus_per_task: 4
    salmon_index:
        runtime: 360
        cpus_per_task: 16
    hisat2_index:
        runtime: 360
        cpus_per_task: 16
    bwa_mem2_index:
        runtime: 360
        cpus_per_task: 20
    bwa_meme_index:
        runtime: 360
        cpus_per_task: 16
    bismark_genome_preparation:
        runtime: 360
        cpus_per_task: 16
    tx2gene:
        runtime: 120
        cpus_per_task: 8
    minimap2_index:
        runtime: 120
        cpus_per_task: 16
    cellranger_mkref:
        runtime: 360
        cpus_per_task: 16
        mem_mb: 50000
